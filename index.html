<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f5f5f5;
      color: #1a1a1a;
      line-height: 1.5;
    }

    /* Phần đầu báo */
    .site-header {
      background-color: #ffffff;
      border-bottom: 3px solid #111111;
      padding: 20px 16px;
      text-align: center;
    }
    .site-header h1 {
      margin: 0;
      font-size: 32px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .site-tagline {
      margin: 6px 0 0;
      color: #555555;
      font-size: 14px;
    }

    /* Khung nội dung chính */
    .container {
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 16px;
    }
    .section-title {
      font-size: 20px;
      margin: 0 0 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid #d92b2b;
      display: inline-block;
    }

    /* Lưới bài báo */
    .post-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    /* Từng bài viết */
    .post-item {
      background-color: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      overflow: hidden;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .post-item:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
    }
    .post-link {
      text-decoration: none;
      color: inherit;
      display: block;
    }
    .post-item img {
      width: 100%;
      aspect-ratio: 16 / 10; /* Giữ mọi ảnh cùng tỷ lệ ngang chuẩn báo */
      object-fit: cover;     /* Cắt gọn phần thừa để không bị méo */
      display: block;
    }
    .post-body {
      padding: 14px;
    }
    .post-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      color: #d92b2b;
      margin-bottom: 6px;
    }
    .post-title {
      margin: 0 0 8px;
      font-size: 17px;
      font-weight: bold;
      color: #111111;
    }
    .post-link:hover .post-title {
      color: #6fff00;
    }
    .post-excerpt {
      margin: 0;
      font-size: 14px;
      color: #555555;
    }

    /* Responsive cho tablet và điện thoại */
    @media (max-width: 900px) {
      .post-list {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    @media (max-width: 560px) {
      .post-list {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
